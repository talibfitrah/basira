# بناء برنامج سطح المكتب على أجهزة GitHub (ويندوز وماك ولينكس) — اختياري.
# يُشغَّل يدويًّا من تبويب Actions، والملفات الناتجة تظهر في «Artifacts».
name: desktop
on: workflow_dispatch
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - name: build
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ./desktop/build.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: basira-${{ matrix.target }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.AppImage
